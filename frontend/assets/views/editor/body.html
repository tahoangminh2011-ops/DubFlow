<div class="ed" id="app">
  <div class="conn-bar" id="connBar"></div>
  <header class="ed-top" id="top"></header>
  <section class="ocr-live-log" id="ocrLiveLog" aria-live="polite">
    <div class="ocr-live-log-head"><b>OCR LIVE</b><span id="ocrLiveState">Idle</span></div>
    <div class="ocr-live-lines" id="ocrLiveLines"></div>
  </section>
  <div class="ed-body">
    <aside class="ed-segs" id="segs"></aside>
    <main class="ed-center" id="center"></main>
    <aside class="ed-side" id="side" hidden><div class="side-scroll" id="sideScroll"></div></aside>
  </div>
  <nav class="mtabs" id="mtabs"></nav>
  <section class="ed-tl" id="tl" data-tour="timeline">
    <div class="tl-head" id="tlHead"></div>
    <div class="tl-body" id="tlBody">
      <div class="tl-labels" id="tlLabels"></div>
      <div class="tl-scroll" id="tlScroll"><div class="tl-sticky"><canvas id="tlCanvas"></canvas></div><div class="tl-spacer" id="tlSpacer"></div></div>
    </div>
  </section>
</div>
<div id="layers"></div>
<div class="toasts" id="toasts"></div>
